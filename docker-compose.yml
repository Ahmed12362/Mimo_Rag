# Local development dependencies. Usage: copy .env.example to .env, then `docker compose up -d`.
# Only PostgreSQL is needed for M0. The pgvector image is used now so M4 needs no extra download;
# the `vector` extension is NOT enabled until a Flyway migration in M4.
name: mimorag

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimorag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MIMORAG_DB_OWNER_PASSWORD: ${MIMORAG_DB_OWNER_PASSWORD:?set MIMORAG_DB_OWNER_PASSWORD in .env}
      MIMORAG_DB_APP_PASSWORD: ${MIMORAG_DB_APP_PASSWORD:?set MIMORAG_DB_APP_PASSWORD in .env}
    ports:
      # Bound to loopback only; 5433 by default to avoid clashing with a locally installed PostgreSQL.
      - "127.0.0.1:${MIMORAG_DB_PORT:-5433}:5432"
    volumes:
      - mimorag-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # Optional OCR service (slice 2d). Started only with `docker compose --profile ocr up -d ocr`.
  # Development setup: published on loopback only so the app (running on the host) can reach it.
  # In production it must not be published at all; see docs/adr/0014-ocr-service.md.
  ocr:
    profiles: ["ocr"]
    build:
      context: ./ocr-service
      target: runtime
    image: mimorag-ocr:2d
    environment:
      # Empty token = the service refuses to start (at least 32 characters required).
      OCR_TOKEN: ${MIMORAG_OCR_TOKEN:-}
      OCR_PROCESSES: 1
      OCR_THREADS: 4
    ports:
      - "127.0.0.1:${MIMORAG_OCR_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "4"
    restart: unless-stopped

volumes:
  mimorag-pgdata:
